[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pds-analysis"
version = "0.1.0"
description = "Waveform analysis for the ProtoDUNE-VD photon detection system (X-ARAPUCA SPE calibration, coincidences, deconvolution, fits)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "iminuit>=2",
    "uproot",
    "awkward",
]

[project.optional-dependencies]
# DUNE plot style: pip install "git+https://github.com/DUNE/dune_plot_style.git"
# PyROOT (ROOT) is required by some scripts and is not pip-installable.
dev = ["ruff", "pytest"]

[tool.setuptools]
packages = ["pds"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive", "*.ipynb"]

[tool.ruff.lint]
# Only errors that break execution; the analysis scripts are not style-linted.
select = ["E9", "F63", "F7", "F82"]
